# Srodowisko deweloperskie Solidusa.
#
# Uruchomienie: docker compose -f docker/docker-compose.yml up
#
# Po starcie:
#   http://localhost:8080  - API backendu (Yii3)
#   http://localhost:5173  - interfejs (Vite dev server)
#   http://localhost:8025  - Mailhog, skrzynka na maile wychodzace z dev
#   localhost:3306         - MySQL
name: solidus

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ../backend:/app:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build:
      context: ..
      dockerfile: docker/Dockerfile.php
    volumes:
      - ../backend:/app
    environment:
      APP_ENV: dev
      APP_DEBUG: "true"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: solidus
      DB_USER: solidus
      DB_PASSWORD: solidus
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: dev-tylko-lokalnie-zmien-na-produkcji-0123456789
      FRONTEND_ORIGIN: http://localhost:5173
      # Testy integracyjne celowo czytaja wlasne zmienne TEST_DB_*, zeby nigdy
      # nie trafic w baze robocza - one kasuja i tworza tabele od nowa.
      TEST_DB_HOST: mysql
      TEST_DB_NAME: solidus_test
      TEST_DB_USER: solidus
      TEST_DB_PASSWORD: solidus
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # Worker kolejki - ten sam obraz co php, tylko inna komenda.
  # Obsluguje masowe wysylki maili i odswiezanie danych z aplikacji AML.
  queue:
    build:
      context: ..
      dockerfile: docker/Dockerfile.php
    command: php yii queue:listen-all
    volumes:
      - ../backend:/app
    environment:
      APP_ENV: dev
      DB_HOST: mysql
      DB_NAME: solidus
      DB_USER: solidus
      DB_PASSWORD: solidus
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=caching_sha2_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: solidus
      MYSQL_USER: solidus
      MYSQL_PASSWORD: solidus
    volumes:
      - ./mysql/my.cnf:/etc/mysql/conf.d/solidus.cnf:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Kontener php startuje dopiero, gdy baza faktycznie przyjmuje polaczenia -
      # inaczej pierwsza migracja trafialaby w pustke.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailhog:
    # W dev zaden mail nie wychodzi na zewnatrz - wszystko laduje tutaj.
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  node:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      # Wlasny wolumen na node_modules: pakiety maja byc budowane pod Linuksa
      # w kontenerze, a nie kopiowane z hosta.
      - node-modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8080

volumes:
  mysql-data:
  node-modules:
