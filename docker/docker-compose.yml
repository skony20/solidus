# Srodowisko deweloperskie Solidusa.
#
# Uruchomienie: docker compose -f docker/docker-compose.yml up
#
# Po starcie:
#   http://localhost:8080  - API backendu (Yii3)
#   http://localhost:5173  - interfejs (Vite dev server)
#   http://localhost:8025  - Mailhog, skrzynka na maile wychodzace z dev
#   localhost:3306         - MySQL
name: solidus

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ../backend:/app:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build:
      context: ..
      dockerfile: docker/Dockerfile.php
    volumes:
      - ../backend:/app
    environment:
      APP_ENV: dev
      APP_DEBUG: "true"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: solidus
      DB_USER: solidus
      DB_PASSWORD: solidus
      JWT_SECRET: dev-tylko-lokalnie-zmien-na-produkcji-0123456789
      FRONTEND_ORIGIN: http://localhost:5173
      # Poczta wychodzaca trafia do Mailhoga - podglad na http://localhost:8025.
      MAILER_DSN: smtp://mailhog:1025
      MAILER_FROM: no-reply@solidus.local
      # Testy integracyjne celowo czytaja wlasne zmienne TEST_DB_*, zeby nigdy
      # nie trafic w baze robocza - one kasuja i tworza tabele od nowa.
      TEST_DB_HOST: mysql
      TEST_DB_NAME: solidus_test
      TEST_DB_USER: solidus
      TEST_DB_PASSWORD: solidus
    depends_on:
      mysql:
        condition: service_healthy

  # UWAGA: nie ma tu usług `redis` ani `queue`. Środowisko docelowe nie ma
  # Redisa, więc kolejka zadań jest wyłączona - zadania, które miały działać
  # w tle (masowe wysyłki e-mail, odświeżanie danych AML), będą na razie
  # wykonywane synchronicznie. Jak to przywrócić: docs/ARCHITECTURE.md,
  # sekcja "Kolejka".

  mysql:
    image: mysql:8.0
    # Kolacja i zestaw znakow ida ARGUMENTAMI, a nie przez mysql/my.cnf:
    # MySQL ignoruje pliki konfiguracyjne zapisywalne dla wszystkich, a bind-mount
    # z Windowsa nadaje wlasnie takie prawa - plik byl wiec po cichu pomijany.
    #
    # `utf8mb4_unicode_ci` zamiast `utf8mb4_0900_ai_ci`, bo ta druga istnieje
    # tylko w MySQL 8. Produkcja stoi na MariaDB, ktora jej nie zna. Kolacja
    # decyduje o porownywaniu tekstu, wiec dev musi miec ta sama co produkcja -
    # inaczej UNIQUE na e-mailu zachowuje sie tu i tam inaczej.
    command: >-
      --default-authentication-plugin=caching_sha2_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: solidus
      MYSQL_USER: solidus
      MYSQL_PASSWORD: solidus
    volumes:
      - ./mysql/my.cnf:/etc/mysql/conf.d/solidus.cnf:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Kontener php startuje dopiero, gdy baza faktycznie przyjmuje polaczenia -
      # inaczej pierwsza migracja trafialaby w pustke.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailhog:
    # W dev zaden mail nie wychodzi na zewnatrz - wszystko laduje tutaj.
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  node:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      # Wlasny wolumen na node_modules: pakiety maja byc budowane pod Linuksa
      # w kontenerze, a nie kopiowane z hosta.
      - node-modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8080
      # Bez tego Vite nie zauważa zmian w plikach - powiadomienia systemu
      # plików nie przechodzą przez bind-mount z hosta do kontenera.
      VITE_USE_POLLING: "true"

volumes:
  mysql-data:
  node-modules:
