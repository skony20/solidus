# Nginx przed php-fpm. Jedyne zadanie: oddac statyki i przekazac reszte
# do public/index.php, ktory jest jedynym punktem wejscia aplikacji Yii3.
server {
    listen 80;
    server_name _;
    root /app/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32M;

    # Front (Vite) stoi osobno na :5173 i rozmawia z tym serwerem po HTTP.
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT $document_root;
        # Blokuje wykonanie czegokolwiek poza index.php.
        internal;
    }

    # Zaden inny plik .php nie jest punktem wejscia.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
