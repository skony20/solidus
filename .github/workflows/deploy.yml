# Wdrozenie Solidusa na hosting Cyber-Folks przez SSH (rsync) po pushu na main.
#
# Solidus to DWIE aplikacje, ale na tym hostingu jeden wspolny adres:
#  1. frontend (SPA)  -> zbudowany `dist` laduje w katalogu domeny (REMOTE_WEB_DIR),
#  2. backend (Yii3)  -> laduje w PODKATALOGU tego samego katalogu domeny
#     (REMOTE_APP_DIR = REMOTE_WEB_DIR/<nazwa>), a `.htaccess` SPA przepisuje
#     `/api/*` na jego `public/index.php`.
#
# DLACZEGO BACKEND JEST W SRODKU KATALOGU SPA, A NIE OBOK NIEGO ANI NA OSOBNEJ
# SUBDOMENIE: to jedyny uklad, ktory na tym hostingu dziala. Sprawdzone
# bezposrednio: (a) PHP w katalogu POZA web rootem domeny zwraca 500 z pusta
# trescia, takze przez dowiazanie symboliczne - hosting wykonuje PHP wylacznie
# dla plikow fizycznie lezacych w drzewie danej domeny; (b) osobna subdomena
# `api.*` z panelu w ogole nie wykonuje PHP, niezaleznie od ustawionej wersji
# i wskazanego katalogu - przyczyna nieznana, po stronie hostingu, nie kodu.
# Bezpieczenstwo katalogu backendu (mimo ze lezy "w srodku") pilnuje wylacznie
# `backend/.htaccess` (`Deny from all`) - patrz ten plik po szczegoly.
#
# Efekt uboczny tego ukladu jest pozytywny: SPA i API maja to samo pochodzenie,
# wiec CORS przestaje byc potrzebny (CorsMiddleware zostaje w kodzie - dziala
# nieszkodliwie, przyda sie np. klientowi mobilnemu z innego originu).
#
# Dlaczego budujemy TUTAJ, a nie na serwerze: ani `vendor/`, ani `dist/` nie sa
# w repozytorium (patrz .gitignore). Hosting wspoldzielony nie ma Node.js, a
# `composer install` na serwerze potrafi wywrocic sie na limicie pamieci.
# Runner buduje jedno i drugie, a na serwer jedzie gotowy wynik.
#
# Czego ten workflow NIE robi - swiadomie:
#  - NIE odpala migracji. `php yii migrate:up` uruchamiasz sam po SSH. Migracja
#    puszczona automatycznie przy kazdym pushu potrafi zablokowac tabele w
#    srodku dnia; to ma byc Twoja decyzja, nie efekt uboczny merge'a.
#  - NIE nadpisuje `.env` na serwerze (jest na liscie --exclude). Sekrety
#    produkcyjne zyja wylacznie tam.
#  - NIE kasuje plikow, ktorych nie ma w repo (brak --delete). Plik usuniety z
#    repo trzeba skasowac na serwerze recznie. Chroni to `runtime/`, `.env`
#    i katalogi z danymi.
name: Deploy na serwer (SSH)

on:
  push:
    branches: [main]
  # pozwala odpalic recznie z zakladki Actions
  workflow_dispatch:

# dwa deploye naraz mieszalyby pliki na serwerze
concurrency:
  group: deploy-ssh
  cancel-in-progress: false

jobs:
  deploy:
    name: Zbuduj i wyslij przez rsync
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v5

      # --- BUDOWANIE BACKENDU ------------------------------------------------
      # Wersja PHP musi byc TA SAMA, co na serwerze. composer.json ma
      # "php": "~8.5.0", a composer zapisuje w vendor/composer/platform_check.php
      # kontrole wersji - przy niezgodnosci aplikacja padnie na starcie z
      # czytelnym komunikatem, zamiast dzialac po polowie.
      - name: Zainstaluj PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_mysql, mbstring, filter, json
          coverage: none

      - name: Zainstaluj zaleznosci PHP (bez dev)
        working-directory: backend
        # --no-dev: na produkcji nie ma po co lezec PHPUnit, Psalm i Codeception.
        # --optimize-autoloader: mapa klas zamiast skanowania katalogow przy
        # kazdym zadaniu - na dysku hostingu wspoldzielonego to realna roznica.
        run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader --prefer-dist

      # --- BUDOWANIE FRONTENDU -----------------------------------------------
      - name: Zainstaluj Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Zainstaluj zaleznosci frontendu
        working-directory: frontend
        # `npm ci` zamiast `npm install`: instaluje dokladnie to, co jest w
        # package-lock.json, i wywala sie, gdy lock rozjechal sie z package.json.
        run: npm ci

      - name: Zbuduj SPA
        working-directory: frontend
        env:
          # Adres API jest WKOMPILOWANY w pliki SPA (Vite podstawia zmienne
          # VITE_* w czasie budowania, nie dziala). Zmiana adresu API wymaga
          # wiec ponownego zbudowania, a nie tylko edycji pliku na serwerze.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Brak zmiennej VITE_API_URL (Settings -> Secrets and variables -> Actions -> Variables)."
            echo "::error::Bez niej SPA odpytywalaby http://localhost:8080 i na produkcji nie dzialalaby wcale."
            exit 1
          fi
          npm run build

      # --- WYSYLKA -----------------------------------------------------------
      - name: Przygotuj klucz SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          # Cyber-Folks trzyma SSH na 222, nie na 22
          SSH_PORT: ${{ secrets.SSH_PORT || 222 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # pobranie klucza hosta zamiast wylaczania weryfikacji -
          # dzieki temu polaczenie nadal jest chronione przed podszyciem
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Wyslij backend
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 222 }}
          SSH_USER: ${{ secrets.SSH_USER }}
          # Podkatalog wewnatrz katalogu domeny SPA (patrz uwaga na gorze pliku),
          # np. /home/UZYTKOWNIK/domains/DOMENA/public_html/SPA/api-app.
          # src/, config/, vendor/ i .env sa mimo to poza zasiegiem przegladarki -
          # pilnuje tego backend/.htaccess (`Deny from all`), a nie polozenie.
          REMOTE_APP_DIR: ${{ secrets.REMOTE_APP_DIR }}
        run: |
          rsync -rlzv --checksum \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            --exclude='.git' \
            --exclude='.git*' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='runtime/' \
            --exclude='tests/' \
            --exclude='docker/' \
            --exclude='.phpunit.cache/' \
            --exclude='codeception.yml' \
            --exclude='phpunit.xml.dist' \
            --exclude='psalm.xml' \
            --exclude='rector.php' \
            --exclude='composer-dependency-analyser.php' \
            --exclude='Makefile' \
            --exclude='c3.php' \
            --exclude='yii.bat' \
            backend/ "$SSH_USER@$SSH_HOST:$REMOTE_APP_DIR/"

      - name: Wyslij SPA
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 222 }}
          SSH_USER: ${{ secrets.SSH_USER }}
          # Katalog domeny SPA - tu laduje zawartosc frontend/dist. REMOTE_APP_DIR
          # (backend) jest jego podkatalogiem, ale ten krok go nie rusza: brak
          # --delete oznacza, ze rsync dotyka wylacznie plikow z `dist/`,
          # podkatalog backendu zostaje nietkniety niezaleznie od kolejnosci
          # tych dwoch kroków wysylki.
          REMOTE_WEB_DIR: ${{ secrets.REMOTE_WEB_DIR }}
        # Ukosnik na koncu `dist/` jest znaczacy: wysyla ZAWARTOSC katalogu,
        # a nie sam katalog. Bez niego powstaloby REMOTE_WEB_DIR/dist/.
        run: |
          rsync -rlzv --checksum \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            frontend/dist/ "$SSH_USER@$SSH_HOST:$REMOTE_WEB_DIR/"

      # Yii cachuje w runtime/ m.in. plan scalania konfiguracji. Po podmianie
      # kodu stary cache opisuje poprzednia wersje - czyscimy, zeby aplikacja
      # nie czytala nieaktualnej mapy. Katalogu nie kasujemy, tylko jego
      # zawartosc; sam runtime/ musi zostac zapisywalny.
      - name: Wyczysc cache aplikacji
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 222 }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_APP_DIR: ${{ secrets.REMOTE_APP_DIR }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$REMOTE_APP_DIR/runtime' && rm -rf '$REMOTE_APP_DIR/runtime/cache' && chmod -R u+rwX '$REMOTE_APP_DIR/runtime'"

      - name: Posprzataj klucz
        if: always()
        run: rm -f ~/.ssh/deploy_key
